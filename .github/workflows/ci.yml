```yaml
name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "GitHub Actions is working"
          ls -la

      - name: Check Docker version
        run: docker --version

      - name: Check Docker Compose version
        run: docker compose version

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker image
        run: docker build -t ultimate-devops-project-demo:latest .
```

### Now do this

Open the file:

```bash
vi .github/workflows/ci.yml
```

Replace the contents with the above file.

Save:

```text
Esc
:wq
Enter
```

Then run:

```bash
git diff
```

and:

```bash
git status
```

