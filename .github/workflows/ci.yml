name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker version
        run: docker --version

      - name: Build Docker image
        run: |
          docker build -t devsecops-projectone:latest .
